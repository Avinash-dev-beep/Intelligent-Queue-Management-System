<!DOCTYPE html>
<html>
<head>
    <title>Login | Intelligent Queue Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf2ff, #f5f3ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            min-height: 540px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        /* LEFT SIDE */
        .left {
            width: 45%;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .left h1 {
            font-size: 36px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.9;
        }

        .icon {
            font-size: 75px;
            margin-top: 35px;
        }

        /* RIGHT SIDE */
        .right {
            width: 55%;
            padding: 65px 60px;
        }

        .right h2 {
            font-size: 32px;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            color: #334155;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 750px) {
            .container {
                width: 94%;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
                padding: 45px 35px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SECTION -->
    <div class="left">

        <div class="logo">IQMS</div>

        <h1>
            Welcome<br>
            Back!
        </h1>

        <p>
            Login to your Intelligent Queue Management System
            and easily manage your appointments and queue status.
        </p>

        <div class="icon">🎫</div>

    </div>


    <!-- LOGIN SECTION -->
    <div class="right">

        <h2>User Login</h2>

        <p class="subtitle">
            Sign in to continue to your account
        </p>

        <form action="/login" method="POST">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?
            <a href="/register">Create Account</a>

        </div>

    </div>

</div>

</body>
</html>
