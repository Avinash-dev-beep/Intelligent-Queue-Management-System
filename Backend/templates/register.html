<!DOCTYPE html>
<html>
<head>
    <title>Register | Intelligent Queue Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf2ff, #f5f3ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 900px;
            min-height: 580px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        /* LEFT SECTION */
        .left {
            width: 45%;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .left h1 {
            font-size: 35px;
            line-height: 1.25;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.9;
        }

        .icon {
            font-size: 75px;
            margin-top: 30px;
        }

        /* RIGHT SECTION */
        .right {
            width: 55%;
            padding: 45px 60px;
        }

        .right h2 {
            font-size: 31px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            color: #334155;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 750px) {

            .container {
                width: 95%;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SECTION -->
    <div class="left">

        <div class="logo">IQMS</div>

        <h1>
            Join the<br>
            Smart Queue!
        </h1>

        <p>
            Create your account and experience a smarter way
            to book appointments, track queue positions and
            reduce unnecessary waiting time.
        </p>

        <div class="icon">⏱️</div>

    </div>


    <!-- REGISTRATION SECTION -->
    <div class="right">

        <h2>Create Account</h2>

        <p class="subtitle">
            Register to use the Intelligent Queue Management System
        </p>

        <form action="/register" method="POST">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>


        <div class="login">

            Already have an account?
            <a href="/login">Login</a>

        </div>

    </div>

</div>

</body>
</html>
